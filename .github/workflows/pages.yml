# Publishes the built plugin (dist/) to GitHub Pages, the hosting Revenge recommends:
# install it from https://anybody4506.github.io/mediaVault-Revenge/MediaVault/
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Upload and deploy are separate jobs, as in GitHub's own Pages template: the deploy job then always finds the
  # uploaded artifact ("No artifacts named github-pages" happened with both steps in one job).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # dist/ is built locally and committed; the smoke test checks it loads before it goes out.
      - run: node tests/smoke.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
